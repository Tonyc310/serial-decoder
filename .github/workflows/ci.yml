name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Oldest supported (tomllib arrived in 3.11) and the latest release.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest
